name: Release

# Push a tag that matches versionName in app/build.gradle.kts, e.g. `git tag v2.0.0 && git push origin v2.0.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # Create the release and upload its files.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName \"$version\" in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Without a keystore the build still succeeds but leaves the APKs unsigned, so fail early.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REMINDER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret REMINDER_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release
        env:
          REMINDER_STORE_FILE: ${{ runner.temp }}/release.jks
          REMINDER_STORE_PASSWORD: ${{ secrets.REMINDER_STORE_PASSWORD }}
          REMINDER_KEY_ALIAS: ${{ secrets.REMINDER_KEY_ALIAS }}
          REMINDER_KEY_PASSWORD: ${{ secrets.REMINDER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/release/app-{arm64-v8a,universal}-release.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep "SHA-256"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          out=app/build/outputs/apk/release
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          cp "$out/app-arm64-v8a-release.apk" "$dist/Reminder-$VERSION-arm64-v8a.apk"
          cp "$out/app-universal-release.apk" "$dist/Reminder-$VERSION-universal.apk"
          (cd "$dist" && sha256sum *.apk > SHA256SUMS)
          # Tags like v2.1.0-beta1 become pre-releases.
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "$dist"/* --title "Reminder $VERSION" --generate-notes --verify-tag "${prerelease[@]}"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
